name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phasedb_test
          MYSQL_USER: phasedb
          MYSQL_PASSWORD: phasedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      TEST_DATABASE_URL: "mysql://phasedb:phasedb@127.0.0.1:3306/phasedb_test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u phasedb -pphasedb --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            echo "waiting... ($i)"
            sleep 2
          done

      - name: Grant privileges
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            GRANT ALL PRIVILEGES ON phasedb_test.* TO 'phasedb'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run integration tests
        run: go test -v -tags integration -timeout 5m ./tests/integration/...
